name: Windows Release CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        working-directory: engine
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pytest pydantic anyio starlette httpx networkx pyinstaller joblib scikit-learn

      - name: Run Backend Tests
        working-directory: engine
        run: |
          $env:PYTHONPATH="."
          pytest

      - name: Build Python Sidecar
        working-directory: engine
        run: |
          pyinstaller --name engine --onefile --add-data "datasets/demo/*.json;datasets/demo" main.py

      - name: Place Sidecar for Tauri
        run: |
          mkdir -p src-tauri/bin
          cp engine/dist/engine.exe src-tauri/bin/engine-x86_64-pc-windows-msvc.exe

      - name: Install Node Dependencies
        working-directory: frontend
        run: npm install

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      - name: Build Tauri Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberScope-Windows-x64
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
